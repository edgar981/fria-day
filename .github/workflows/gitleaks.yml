name: gitleaks

# Escaneo de secretos (Pasada SEC.3). Corre en cada PR (escanea el diff) y en cada push a main
# (escanea la historia completa). Falla el build si detecta un secreto. Config: .gitleaks.toml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historia completa (necesaria para el scan de árbol completo en push a main)

      - name: Instalar gitleaks
        run: |
          VERSION=8.30.1
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: gitleaks — diff del Pull Request
        if: github.event_name == 'pull_request'
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .

      - name: gitleaks — historia completa (push a main)
        if: github.event_name == 'push'
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .
